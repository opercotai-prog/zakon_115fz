<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чек-лист по статье 6.1 115-ФЗ</title>
    <style>
        /* ===== БАЗОВЫЕ СТИЛИ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f6f8fa;
            color: #1a1a2e;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: white;
            padding: 28px 32px;
            border-radius: 16px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .header h1 { font-size: 26px; font-weight: 700; }
        .header .subtitle { font-size: 16px; opacity: 0.85; margin-top: 6px; }
        .header .meta {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 14px;
            opacity: 0.9;
        }
        .header .meta span {
            background: rgba(255,255,255,0.12);
            padding: 4px 14px;
            border-radius: 20px;
        }

        /* ===== ПАНЕЛЬ ЗАГРУЗКИ ===== */
        .upload-panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9edf2;
        }
        .upload-panel h3 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #0f3460;
        }
        .upload-panel .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .upload-panel .row label {
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            min-width: 120px;
        }
        .upload-panel input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        .upload-panel input[type="text"]:focus {
            border-color: #0f3460;
            outline: none;
        }
        .file-drop-zone {
            border: 2px dashed #cbd5e1;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
            flex: 1;
        }
        .file-drop-zone:hover {
            border-color: #0f3460;
            background: #f1f5f9;
        }
        .file-drop-zone.dragover {
            border-color: #0f3460;
            background: #e2e8f0;
        }
        .file-drop-zone .file-name {
            margin-top: 6px;
            font-size: 14px;
            color: #475569;
        }
        .upload-panel .btn-check {
            background: #0f3460;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .upload-panel .btn-check:hover { background: #1a4a7a; }
        .upload-panel .btn-check:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .upload-panel .status-msg {
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .upload-panel .status-msg.show { display: block; }
        .upload-panel .status-msg.success { background: #dcfce7; color: #166534; border-left: 4px solid #22c55e; }
        .upload-panel .status-msg.error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        .upload-panel .status-msg.info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }

        .spinner-small {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #0f3460;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== ПРОГРЕСС ===== */
        .progress-bar-wrap {
            background: white;
            border-radius: 12px;
            padding: 18px 24px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .progress-bar-wrap .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        .progress-bar-wrap .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .stat-dot.ok { background: #22c55e; }
        .stat-dot.warn { background: #eab308; }
        .stat-dot.fail { background: #ef4444; }
        .stat-dot.unknown { background: #94a3b8; }

        .progress-track {
            flex: 1;
            min-width: 140px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-track .fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ===== ГРУППЫ ===== */
        .group {
            background: white;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            border: 1px solid #e9edf2;
        }
        .group-header {
            padding: 18px 24px;
            background: #fafbfc;
            border-bottom: 1px solid #e9edf2;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }
        .group-header:hover { background: #f1f4f8; }
        .group-header .group-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f3460;
        }
        .group-header .group-meta {
            font-size: 14px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .group-header .group-meta .badge {
            background: #e2e8f0;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #334155;
        }
        .group-body { padding: 8px 24px 24px; }
        .group-body.collapsed { display: none; }

        /* ===== ВОПРОСЫ ===== */
        .check-item {
            padding: 16px 0;
            border-bottom: 1px solid #f1f4f8;
        }
        .check-item:last-child { border-bottom: none; }

        .check-question {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .check-question .id {
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            white-space: nowrap;
            min-width: 70px;
        }
        .check-norm {
            font-size: 13px;
            color: #64748b;
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            margin: 6px 0 10px 82px;
            border-left: 3px solid #94a3b8;
            line-height: 1.5;
        }
        .check-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 14px;
            margin-left: 82px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn-group button {
            padding: 5px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #334155;
        }
        .btn-group button:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }
        .btn-group button.active-yes {
            border-color: #22c55e;
            background: #dcfce7;
            color: #166534;
        }
        .btn-group button.active-no {
            border-color: #ef4444;
            background: #fee2e2;
            color: #991b1b;
        }
        .btn-group button.active-partial {
            border-color: #eab308;
            background: #fef9c3;
            color: #854d0e;
        }
        .btn-group button.active-unknown {
            border-color: #94a3b8;
            background: #f1f5f9;
            color: #475569;
        }

        .recommendation {
            margin-top: 8px;
            margin-left: 82px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            background: #fef3c7;
            border-left: 4px solid #eab308;
            color: #78350f;
            display: none;
        }
        .recommendation.show { display: block; }
        .recommendation.warn {
            background: #fee2e2;
            border-left-color: #ef4444;
            color: #991b1b;
        }
        .recommendation.info {
            background: #dbeafe;
            border-left-color: #3b82f6;
            color: #1e40af;
        }
        .recommendation.success {
            background: #dcfce7;
            border-left-color: #22c55e;
            color: #166534;
        }

        .status-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 12px;
            margin-left: 6px;
        }
        .status-badge.ok { background: #dcfce7; color: #166534; }
        .status-badge.warn { background: #fef9c3; color: #854d0e; }
        .status-badge.fail { background: #fee2e2; color: #991b1b; }
        .status-badge.unknown { background: #f1f5f9; color: #475569; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 28px;
        }
        .toolbar button {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            background: white;
            border: 1px solid #e2e8f0;
            color: #1a1a2e;
        }
        .toolbar button:hover {
            background: #f1f4f8;
            border-color: #94a3b8;
        }
        .toolbar button.primary {
            background: #0f3460;
            color: white;
            border-color: #0f3460;
        }
        .toolbar button.primary:hover { background: #1a4a7a; }
        .toolbar button.danger {
            color: #ef4444;
            border-color: #fca5a5;
        }
        .toolbar button.danger:hover { background: #fee2e2; }

        .export-area {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-family: "Courier New", monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 360px;
            overflow: auto;
            display: none;
            margin-top: 12px;
        }
        .export-area.show { display: block; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            body { padding: 12px; }
            .header { padding: 20px; }
            .header h1 { font-size: 20px; }
            .check-question { flex-wrap: wrap; }
            .check-question .id { min-width: auto; }
            .check-norm,
            .check-actions,
            .recommendation { margin-left: 0; }
            .check-actions { flex-direction: column; align-items: stretch; }
            .btn-group { flex-wrap: wrap; }
            .progress-bar-wrap { flex-direction: column; align-items: stretch; }
            .group-body { padding: 8px 16px 16px; }
            .upload-panel .row { flex-direction: column; align-items: stretch; }
            .upload-panel .row label { min-width: auto; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1>📋 Чек-лист по статье 6.1 115-ФЗ</h1>
        <div class="subtitle">Обязанности юридического лица по раскрытию информации о своих бенефициарных владельцах</div>
        <div class="meta">
            <span>📄 Статья 6.1</span>
            <span>📅 Версия 1.0</span>
            <span id="totalQuestions">⏳ Загрузка...</span>
        </div>
    </div>

    <!-- ===== ПАНЕЛЬ ЗАГРУЗКИ ДОКУМЕНТА ===== -->
    <div class="upload-panel">
        <h3>📎 Проверка документа по чек-листу</h3>
        <div class="row">
            <label for="apiKey">🔑 API-ключ OpenRouter</label>
            <input type="text" id="apiKey" placeholder="sk-or-v1-... (получить на openrouter.ai/keys)" />
        </div>
        <div class="row" style="margin-top:12px;">
            <label>📂 Документ</label>
            <div class="file-drop-zone" id="dropZone">
                <div>📂 Перетащите файл сюда или кликните для выбора</div>
                <input type="file" id="fileInput" accept=".docx,.pdf" style="display:none;" />
                <div class="file-name" id="fileName">Файл не выбран</div>
            </div>
            <button class="btn-check" id="checkBtn" disabled>🔍 Проверить</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- ===== PROGRESS ===== -->
    <div class="progress-bar-wrap" id="progressWrap">
        <div class="stats">
            <span class="stat-item"><span class="stat-dot ok"></span> OK: <strong id="statOk">0</strong></span>
            <span class="stat-item"><span class="stat-dot warn"></span> WARN: <strong id="statWarn">0</strong></span>
            <span class="stat-item"><span class="stat-dot fail"></span> FAIL: <strong id="statFail">0</strong></span>
            <span class="stat-item"><span class="stat-dot unknown"></span> Н/Д: <strong id="statUnknown">0</strong></span>
        </div>
        <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:100px;">
            <span style="font-size:14px; color:#475569;" id="progressPercent">0%</span>
            <div class="progress-track"><div class="fill" id="progressFill"></div></div>
        </div>
    </div>

    <!-- ===== TOOLBAR ===== -->
    <div class="toolbar">
        <button class="primary" onclick="exportResults()">📤 Экспорт результатов (JSON)</button>
        <button onclick="resetAll()" class="danger">🔄 Сбросить все ответы</button>
        <button onclick="toggleAllGroups()">📂 Свернуть / Развернуть все</button>
    </div>

    <div class="export-area" id="exportArea"></div>

    <!-- ===== GROUPS ===== -->
    <div id="groupsContainer"></div>
</div>

<script>
    // ============================================================
    // 1. DATA
    // ============================================================
    let checklistData = null;
    let answers = {};
    let selectedFile = null;

    // ============================================================
    // 2. LOAD JSON
    // ============================================================
    async function loadChecklist() {
        try {
            const resp = await fetch('research/115fz/checklists/article_6.1_checklist_v1.0.json');
            if (!resp.ok) throw new Error('Не удалось загрузить JSON');
            checklistData = await resp.json();
            initFromData();
        } catch (e) {
            document.getElementById('groupsContainer').innerHTML = `
                <div style="background:#fee2e2;padding:20px;border-radius:10px;color:#991b1b;">
                    ❌ Ошибка загрузки: ${e.message}<br>
                    Убедитесь, что файл <code>research/115fz/checklists/article_6.1_checklist_v1.0.json</code> существует.
                </div>
            `;
            console.error(e);
        }
    }

    // ============================================================
    // 3. INIT
    // ============================================================
    function initFromData() {
        let total = 0;
        for (const g of checklistData.groups) {
            total += g.checks.length;
        }
        document.getElementById('totalQuestions').textContent = `📊 Всего вопросов: ${total}`;

        const saved = localStorage.getItem('checklist_answers_6.1');
        if (saved) {
            try { answers = JSON.parse(saved); } catch (e) {}
        }
        renderGroups();
        updateProgress();
    }

    // ============================================================
    // 4. RENDER
    // ============================================================
    function renderGroups() {
        const container = document.getElementById('groupsContainer');
        let html = '';

        for (const group of checklistData.groups) {
            const groupId = group.id;
            const allChecks = group.checks;
            const answered = allChecks.filter(c => answers[c.id] && answers[c.id] !== 'UNKNOWN').length;
            const total = allChecks.length;
            const pct = total > 0 ? Math.round((answered / total) * 100) : 0;

            html += `
                <div class="group" data-group="${groupId}">
                    <div class="group-header" onclick="toggleGroup('${groupId}')">
                        <span class="group-title">${group.name}</span>
                        <span class="group-meta">
                            <span class="badge">${answered}/${total} (${pct}%)</span>
                            <span style="font-size:18px;">▾</span>
                        </span>
                    </div>
                    <div class="group-body" id="groupBody_${groupId}">
            `;

            for (const check of allChecks) {
                const val = answers[check.id] || 'UNKNOWN';
                let recText = '';
                let recClass = 'info';
                if (val === 'NO' && check.recommendation_if_no) {
                    recText = check.recommendation_if_no;
                    recClass = 'warn';
                } else if (val === 'PARTIAL' && check.recommendation_if_partial) {
                    recText = check.recommendation_if_partial;
                    recClass = 'warn';
                } else if (val === 'YES') {
                    recText = '✅ Всё в порядке.';
                    recClass = 'success';
                }

                const statusLabel = { 'YES':'OK', 'NO':'FAIL', 'PARTIAL':'WARN', 'UNKNOWN':'Н/Д' }[val] || 'Н/Д';
                const statusClass = { 'YES':'ok', 'NO':'fail', 'PARTIAL':'warn', 'UNKNOWN':'unknown' }[val] || 'unknown';

                html += `
                    <div class="check-item" data-id="${check.id}">
                        <div class="check-question">
                            <span class="id">${check.id}</span>
                            <span>
                                ${check.question}
                                <span class="status-badge ${statusClass}">${statusLabel}</span>
                            </span>
                        </div>
                        ${check.norm_text ? `
                            <div class="check-norm">
                                <strong>📌 ${check.point}:</strong> ${check.norm_text}
                            </div>
                        ` : ''}
                        <div class="check-actions">
                            <div class="btn-group">
                                <button data-id="${check.id}" data-val="YES" class="${val === 'YES' ? 'active-yes' : ''}" onclick="setAnswer('${check.id}','YES')">✅ Да</button>
                                <button data-id="${check.id}" data-val="NO" class="${val === 'NO' ? 'active-no' : ''}" onclick="setAnswer('${check.id}','NO')">❌ Нет</button>
                                <button data-id="${check.id}" data-val="PARTIAL" class="${val === 'PARTIAL' ? 'active-partial' : ''}" onclick="setAnswer('${check.id}','PARTIAL')">⚠️ Частично</button>
                                <button data-id="${check.id}" data-val="UNKNOWN" class="${val === 'UNKNOWN' ? 'active-unknown' : ''}" onclick="setAnswer('${check.id}','UNKNOWN')">❓ Н/Д</button>
                            </div>
                            <div class="recommendation ${recText ? 'show' : ''} ${recClass}" id="rec_${check.id}">
                                ${recText || 'Выберите ответ для рекомендации.'}
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
        }

        container.innerHTML = html;
    }

    // ============================================================
    // 5. INTERACTIONS
    // ============================================================
    function setAnswer(id, val) {
        answers[id] = val;
        saveState();
        renderSingleCheck(id);
        updateProgress();
    }

    function renderSingleCheck(id) {
        const item = document.querySelector(`.check-item[data-id="${id}"]`);
        if (!item) return;
        const val = answers[id] || 'UNKNOWN';

        const btns = item.querySelectorAll('.btn-group button');
        btns.forEach(b => {
            const bVal = b.getAttribute('data-val');
            b.className = '';
            if (bVal === val) {
                if (val === 'YES') b.classList.add('active-yes');
                else if (val === 'NO') b.classList.add('active-no');
                else if (val === 'PARTIAL') b.classList.add('active-partial');
                else if (val === 'UNKNOWN') b.classList.add('active-unknown');
            }
        });

        const badge = item.querySelector('.status-badge');
        if (badge) {
            const labels = { 'YES':'OK','NO':'FAIL','PARTIAL':'WARN','UNKNOWN':'Н/Д' };
            const classes = { 'YES':'ok','NO':'fail','PARTIAL':'warn','UNKNOWN':'unknown' };
            badge.textContent = labels[val] || 'Н/Д';
            badge.className = `status-badge ${classes[val] || 'unknown'}`;
        }

        const rec = document.getElementById(`rec_${id}`);
        if (rec) {
            let check = null;
            for (const g of checklistData.groups) {
                const found = g.checks.find(c => c.id === id);
                if (found) { check = found; break; }
            }
            if (check) {
                let text = '', cls = 'info';
                if (val === 'NO' && check.recommendation_if_no) {
                    text = check.recommendation_if_no;
                    cls = 'warn';
                } else if (val === 'PARTIAL' && check.recommendation_if_partial) {
                    text = check.recommendation_if_partial;
                    cls = 'warn';
                } else if (val === 'YES') {
                    text = '✅ Всё в порядке.';
                    cls = 'success';
                }
                rec.textContent = text || 'Выберите ответ для рекомендации.';
                rec.className = `recommendation ${text ? 'show' : ''} ${cls}`;
            }
        }
        updateGroupProgress();
    }

    function toggleGroup(id) {
        const body = document.getElementById(`groupBody_${id}`);
        if (body) body.classList.toggle('collapsed');
    }

    function toggleAllGroups() {
        const all = document.querySelectorAll('.group-body');
        const anyCollapsed = Array.from(all).some(el => el.classList.contains('collapsed'));
        all.forEach(el => {
            if (anyCollapsed) el.classList.remove('collapsed');
            else el.classList.add('collapsed');
        });
    }

    // ============================================================
    // 6. PROGRESS
    // ============================================================
    function updateProgress() {
        let total = 0, ok = 0, warn = 0, fail = 0, unknown = 0;
        for (const g of checklistData.groups) {
            for (const c of g.checks) {
                total++;
                const val = answers[c.id] || 'UNKNOWN';
                if (val === 'YES') ok++;
                else if (val === 'NO') fail++;
                else if (val === 'PARTIAL') warn++;
                else unknown++;
            }
        }
        document.getElementById('statOk').textContent = ok;
        document.getElementById('statWarn').textContent = warn;
        document.getElementById('statFail').textContent = fail;
        document.getElementById('statUnknown').textContent = unknown;

        const answered = ok + warn + fail;
        const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
        document.getElementById('progressPercent').textContent = `${pct}%`;
        document.getElementById('progressFill').style.width = `${pct}%`;

        for (const g of checklistData.groups) {
            const groupEl = document.querySelector(`.group[data-group="${g.id}"]`);
            if (!groupEl) continue;
            const checks = g.checks;
            const answeredInGroup = checks.filter(c => answers[c.id] && answers[c.id] !== 'UNKNOWN').length;
            const pctGroup = checks.length > 0 ? Math.round((answeredInGroup / checks.length) * 100) : 0;
            const badge = groupEl.querySelector('.badge');
            if (badge) badge.textContent = `${answeredInGroup}/${checks.length} (${pctGroup}%)`;
        }
    }

    function updateGroupProgress() { updateProgress(); }

    // ============================================================
    // 7. STATE
    // ============================================================
    function saveState() {
        localStorage.setItem('checklist_answers_6.1', JSON.stringify(answers));
    }

    // ============================================================
    // 8. EXPORT / RESET
    // ============================================================
    function exportResults() {
        const result = {
            article: checklistData.article,
            title: checklistData.title,
            law: checklistData.law,
            exported_at: new Date().toISOString(),
            answers: answers,
            summary: {}
        };
        let total = 0, ok = 0, warn = 0, fail = 0, unknown = 0;
        for (const g of checklistData.groups) {
            for (const c of g.checks) {
                total++;
                const val = answers[c.id] || 'UNKNOWN';
                if (val === 'YES') ok++;
                else if (val === 'NO') fail++;
                else if (val === 'PARTIAL') warn++;
                else unknown++;
            }
        }
        result.summary = { total, ok, warn, fail, unknown };
        const json = JSON.stringify(result, null, 2);
        const area = document.getElementById('exportArea');
        area.textContent = json;
        area.classList.toggle('show');
        navigator.clipboard?.writeText(json).catch(() => {});
    }

    function resetAll() {
        if (!confirm('Сбросить все ответы?')) return;
        answers = {};
        saveState();
        renderGroups();
        updateProgress();
        document.getElementById('exportArea').classList.remove('show');
    }

    // ============================================================
    // 9. FILE UPLOAD & CHECK
    // ============================================================
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const checkBtn = document.getElementById('checkBtn');
    const statusMsg = document.getElementById('statusMsg');
    const apiKeyInput = document.getElementById('apiKey');

    // Клик по зоне → открыть выбор файла
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFileSelect();
        }
    });
    fileInput.addEventListener('change', handleFileSelect);

    function handleFileSelect() {
        if (fileInput.files.length) {
            selectedFile = fileInput.files[0];
            fileName.textContent = `📄 ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
            checkBtn.disabled = false;
            showStatus('info', '✅ Файл загружен. Нажмите "Проверить" для анализа.');
        } else {
            selectedFile = null;
            fileName.textContent = 'Файл не выбран';
            checkBtn.disabled = true;
        }
    }

    function showStatus(type, msg) {
        statusMsg.className = `status-msg show ${type}`;
        statusMsg.textContent = msg;
    }

    function hideStatus() {
        statusMsg.className = 'status-msg';
    }

        // ============================================================
    // 10. ПРОВЕРКА ДОКУМЕНТА ЧЕРЕЗ API
    // ============================================================
    checkBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            showStatus('error', '❌ Введите API-ключ OpenRouter (получить на openrouter.ai/keys)');
            return;
        }
        if (!selectedFile) {
            showStatus('error', '❌ Выберите файл для проверки');
            return;
        }

        // Для демо используем UPD_002 (обновление не реже 1 раза в год)
        const checkId = 'UPD_002';
        const checkQuestion = 'Обновляете ли вы информацию не реже 1 раза в год?';

        checkBtn.disabled = true;
        checkBtn.textContent = '⏳ Анализируем...';
        showStatus('info', '⏳ Отправляем документ на анализ (до 30 секунд)...');

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('check_id', checkId);
        formData.append('check_question', checkQuestion);
        formData.append('api_key', apiKey);

        try {
            const response = await fetch('http://10.0.11.53:5000/api/check_document', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Ошибка сервера');
            }

            // Успешный ответ — показываем результат
            let statusType = 'success';
            let statusIcon = '✅';
            if (data.answer === 'NO') {
                statusType = 'error';
                statusIcon = '❌';
            } else if (data.answer === 'PARTIAL') {
                statusType = 'warn';
                statusIcon = '⚠️';
            }

            showStatus(statusType, `${statusIcon} Результат: ${data.answer_display}\n📌 ${data.evidence}`);

            // Автоматически заполняем ответ в чек-листе
            if (data.answer === 'YES' || data.answer === 'NO' || data.answer === 'PARTIAL') {
                setAnswer(checkId, data.answer);
            }

        } catch (error) {
            showStatus('error', '❌ Ошибка: ' + error.message);
        } finally {
            checkBtn.disabled = false;
            checkBtn.textContent = '🔍 Проверить';
        }
    });

    // ============================================================
    // 11. ЗАГРУЗКА ПРИ СТАРТЕ
    // ============================================================
    loadChecklist();
</script>
</body>
</html>
